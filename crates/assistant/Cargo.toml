[package]
name = "cadcraft-assistant"
description = "CADCraft assistant: an LLM agent loop that drives CADCraft through its MCP tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# The OpenAI-compatible HTTP provider (native only). Without it the crate has no network code:
# a host supplies its own `Provider`.
http = ["dep:ureq"]

[dependencies]
cadcraft-mcp = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
ureq = { workspace = true, optional = true }

[dev-dependencies]
cadcraft-engine = { workspace = true }
cadcraft-io = { workspace = true }
